<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Absensi{% endblock %}</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#22c55e; --err:#ef4444; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
.wrap { max-width:720px; margin:0 auto; padding:16px; }
h1 { font-size:1.35rem; margin:0 0 12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
input, select, button { width:100%; font-size:1rem; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0b1220; color:var(--text); }
button { background:var(--accent); color:#082f49; font-weight:700; border:0; cursor:pointer; margin-top:12px; }
button.danger { background:var(--err); color:#fff; width:auto; padding:6px 10px; margin:0; font-size:.8rem; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row > * { flex:1; min-width:140px; }
video, canvas, img.thumb { width:100%; border-radius:10px; background:#000; max-height:280px; object-fit:cover; }
.msg { padding:10px; border-radius:8px; margin-top:10px; }
.msg.ok { background:#14532d; }
.msg.err { background:#7f1d1d; }
table { width:100%; border-collapse:collapse; font-size:.85rem; }
th, td { border-bottom:1px solid var(--line); padding:8px 4px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; }
.top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
a { color:var(--accent); }
.small { font-size:.75rem; color:var(--muted); word-break:break-all; }
@media (max-width:640px) {
  table, thead, tbody, th, td, tr { display:block; }
  thead { display:none; }
  tr { border:1px solid var(--line); border-radius:10px; margin-bottom:10px; padding:8px; }
  td { border:0; padding:4px 0; }
  td::before { content:attr(data-l); display:block; color:var(--muted); font-size:.7rem; }
}
</style>
</head>
<body>
<div class="wrap">
{% block body %}{% endblock %}
</div>
</body>
</html>
