{% extends "base.html" %}
{% block title %}Absensi Karyawan{% endblock %}
{% block body %}
<div class="top">
  <h1>Absensi Karyawan</h1>
  <a href="{{ url_for('login') }}">Admin</a>
</div>
<div class="card">
  <form id="form">
    <label>Nama</label>
    <input name="nama" required placeholder="Nama lengkap" autocomplete="name">
    <label>Bagian</label>
    <input name="bagian" required placeholder="Contoh: Produksi">
    <label>Outsourcing</label>
    <select name="outsourcing" required>
      <option value="">Pilih</option>
      <option>PT. Amanah Amarta</option>
      <option>PT. Krisna Sejati</option>
      <option>PT. Artakemas Indonesia</option>
    </select>
    <label>Status</label>
    <select name="status" required>
      <option value="">Pilih</option>
      <option>Masuk</option>
      <option>Pulang</option>
    </select>
    <label>Kamera wajah</label>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="snap" hidden></canvas>
    <button type="button" id="btnFoto">Ambil foto</button>
    <img id="preview" class="thumb" alt="" hidden>
    <label>Lokasi GPS</label>
    <div class="small" id="gps">Mencari lokasi...</div>
    <button type="submit">Kirim absensi</button>
    <div id="hasil"></div>
  </form>
</div>
<script>
const video = document.getElementById('cam');
const canvas = document.getElementById('snap');
const preview = document.getElementById('preview');
const gpsEl = document.getElementById('gps');
let foto = '', lat = '', lng = '';

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
  .then(s => { video.srcObject = s; })
  .catch(() => { gpsEl.textContent = 'Kamera tidak diizinkan / tidak tersedia.'; });

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(p => {
    lat = p.coords.latitude.toFixed(6);
    lng = p.coords.longitude.toFixed(6);
    gpsEl.textContent = lat + ', ' + lng + ' (akurasi ' + Math.round(p.coords.accuracy) + ' m)';
  }, () => { gpsEl.textContent = 'GPS ditolak. Absensi tetap bisa dikirim tanpa koordinat.'; }, { enableHighAccuracy: true, timeout: 10000 });
} else {
  gpsEl.textContent = 'Browser tidak mendukung GPS.';
}

document.getElementById('btnFoto').onclick = () => {
  const w = video.videoWidth || 640, h = video.videoHeight || 480;
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  foto = canvas.toDataURL('image/jpeg', 0.7);
  preview.src = foto; preview.hidden = false;
};

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  if (!foto) { alert('Ambil foto dulu.'); return; }
  if (!lat || !lng) { alert('GPS wajib. Izinkan lokasi lalu kirim lagi.'); return; }
  const fd = new FormData(e.target);
  fd.append('foto', foto);
  fd.append('lat', lat);
  fd.append('lng', lng);
  const res = await fetch('/absen', { method: 'POST', body: fd });
  const data = await res.json();
  const el = document.getElementById('hasil');
  el.className = 'msg ' + (data.ok ? 'ok' : 'err');
  el.textContent = data.msg + (data.waktu ? ' ' + data.waktu : '');
  if (data.ok) e.target.reset();
};
</script>
{% endblock %}
